name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Test with Swift 6 concurrency and warnings enforced
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Build release
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Build for iOS Simulator
        run: >-
          xcodebuild -scheme Assinafy
          -destination 'generic/platform=iOS Simulator'
          -configuration Release
          -derivedDataPath "$RUNNER_TEMP/AssinafyDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build
