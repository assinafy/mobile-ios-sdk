name: Live Sandbox

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      run_mutations:
        description: Run tests that create sandbox resources and send notifications
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sandbox:
    name: Sandbox API
    runs-on: macos-26
    timeout-minutes: 30
    environment: sandbox
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ASSINAFY_BASE_URL: https://sandbox.assinafy.com.br/v1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Mutation runs create sandbox resources and send real notifications, so
      # they are limited to release tags and explicit manual requests. Every
      # other trigger runs the read-only suite. Exactly one suite always runs:
      # the workflow never reports success without exercising the live API.
      - name: Select suite
        id: suite
        env:
          RUN_MUTATIONS: >-
            ${{ github.ref_type == 'tag'
                || (github.event_name == 'workflow_dispatch' && inputs.run_mutations) }}
        run: |
          if [[ "$RUN_MUTATIONS" == "true" ]]; then
            echo "mutations=true" >> "$GITHUB_OUTPUT"
            echo "filter=AssinafyTests.AssinafyLiveTests" >> "$GITHUB_OUTPUT"
          else
            echo "mutations=false" >> "$GITHUB_OUTPUT"
            echo "filter=AssinafyTests.AssinafyLiveTests/(testLiveReadOnlyCatalogAndListEndpoints|testLiveContractReadEndpoints)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check sandbox credentials
        env:
          ASSINAFY_API_KEY: ${{ secrets.ASSINAFY_API_KEY }}
          ASSINAFY_ACCOUNT_ID: ${{ secrets.ASSINAFY_ACCOUNT_ID }}
        run: |
          if [[ -z "$ASSINAFY_API_KEY" || -z "$ASSINAFY_ACCOUNT_ID" ]]; then
            echo "::error::Configure ASSINAFY_API_KEY and ASSINAFY_ACCOUNT_ID in the sandbox environment."
            exit 1
          fi

      - name: Check mutation recipients
        if: ${{ steps.suite.outputs.mutations == 'true' }}
        env:
          ASSINAFY_TEST_EMAIL_A: ${{ secrets.ASSINAFY_TEST_EMAIL_A }}
          ASSINAFY_TEST_EMAIL_B: ${{ secrets.ASSINAFY_TEST_EMAIL_B }}
        run: |
          if [[ -z "$ASSINAFY_TEST_EMAIL_A" || -z "$ASSINAFY_TEST_EMAIL_B" ]]; then
            echo "::error::Configure ASSINAFY_TEST_EMAIL_A and ASSINAFY_TEST_EMAIL_B in the sandbox environment."
            exit 1
          fi
          shopt -s nocasematch
          if [[ "$ASSINAFY_TEST_EMAIL_A" == "$ASSINAFY_TEST_EMAIL_B" ]]; then
            echo "::error::Sandbox mutation recipients must be distinct."
            exit 1
          fi

      # Live tests skip themselves when credentials are missing or the host is
      # not the sandbox, and an all-skipped XCTest run still exits 0 — a green
      # job that never touched the API. The steps above turn every
      # configuration-driven skip into a hard failure; this step additionally
      # requires that at least one live test actually ran, and surfaces any
      # remaining skip (an endpoint not deployed on the sandbox host) as a
      # warning rather than hiding it.
      - name: Run sandbox suite
        env:
          ASSINAFY_API_KEY: ${{ secrets.ASSINAFY_API_KEY }}
          ASSINAFY_ACCOUNT_ID: ${{ secrets.ASSINAFY_ACCOUNT_ID }}
          ASSINAFY_RUN_LIVE_MUTATIONS: ${{ steps.suite.outputs.mutations == 'true' && '1' || '' }}
          ASSINAFY_REQUIRE_LIVE_ASSIGNMENT: ${{ steps.suite.outputs.mutations == 'true' && '1' || '' }}
          ASSINAFY_TEST_EMAIL_A: ${{ secrets.ASSINAFY_TEST_EMAIL_A }}
          ASSINAFY_TEST_EMAIL_B: ${{ secrets.ASSINAFY_TEST_EMAIL_B }}
          SUITE_FILTER: ${{ steps.suite.outputs.filter }}
        run: |
          set -o pipefail
          swift test --filter "$SUITE_FILTER" 2>&1 | tee "$RUNNER_TEMP/live.log"

          summary=$(grep -oE "Executed [0-9]+ tests?, with ([0-9]+ tests? skipped and )?[0-9]+ failures?" \
            "$RUNNER_TEMP/live.log" | tail -n 1)
          if [[ -z "$summary" ]]; then
            echo "::error::No XCTest summary found; the live suite did not run."
            exit 1
          fi
          executed=$(sed -E 's/^Executed ([0-9]+).*/\1/' <<< "$summary")
          skipped=$(sed -nE 's/.*with ([0-9]+) tests? skipped.*/\1/p' <<< "$summary")
          skipped=${skipped:-0}
          echo "Live suite: $summary"
          if (( skipped > 0 )); then
            echo "::warning::${skipped} live test(s) skipped."
          fi
          if (( executed - skipped == 0 )); then
            echo "::error::No live test ran; the sandbox API was never exercised."
            exit 1
          fi
          echo "Live tests actually run: $(( executed - skipped ))"
